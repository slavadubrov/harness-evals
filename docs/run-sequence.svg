<svg xmlns="http://www.w3.org/2000/svg" width="960" height="796" viewBox="0 0 960 796" role="img" aria-labelledby="title desc">
<title id="title">What happens inside run()</title>
<desc id="desc">Sequence diagram. Your script calls run(usecase, harnesses, trials=10, frozen=...). run refuses to start unless frozen names a model, trials is at least 1 and the split has tasks, then writes a manifest. For each trial the first harness rotates; run calls each adapter with a deep copy of the tasks; your harness runs each task on the frozen model and the environment records actions, cost and latency; the adapter returns one Episode per task. Missing episodes become infra errors, duplicates raise, and an adapter exception marks every task in that batch as an infra error. Episodes and the manifest are saved, and run returns 100 episodes: 10 trials, 2 harnesses, 5 tasks.</desc>
