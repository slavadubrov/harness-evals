<svg xmlns="http://www.w3.org/2000/svg" width="960" height="506" viewBox="0 0 960 506" role="img" aria-labelledby="title desc">
<title id="title">The idea: change only the harness</title>
<desc id="desc">Two stacks of three layers. In a model benchmark the tasks, checks and harness are held fixed and the model is swapped. In a harness evaluation the tasks, checks, model and settings are held fixed and only the harness (agent, workflow, agent v2) is swapped, so a difference in the results belongs to the harness.</desc>
<style>
:root {
